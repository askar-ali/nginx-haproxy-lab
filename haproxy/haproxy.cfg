global
  ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
  log stdout format raw local0
  maxconn 2000

defaults
  mode http
  log global
  option httplog
  option forwardfor
  timeout connect 5s
  timeout client  30s
  timeout server  30s
  retries 3

frontend web
  bind *:80
  bind *:443 ssl crt /usr/local/etc/haproxy/certs/lab.pem alpn h2,http/1.1
  # Force HTTPS, except the load balancer's own health probe path.
  http-request redirect scheme https code 301 unless { ssl_fc } || { path /healthz }
  http-request set-header X-Forwarded-Proto https if { ssl_fc }
  http-response set-header Strict-Transport-Security "max-age=31536000" if { ssl_fc }
  default_backend nginx_pool

backend nginx_pool
  balance roundrobin
  option httpchk GET /healthz
  http-check expect status 200
  default-server inter 3s fall 3 rise 2 init-addr last,libc,none
  server nginx1 nginx1:80 check
  server nginx2 nginx2:80 check

frontend stats
  bind *:8404
  stats enable
  stats uri /stats
  stats refresh 5s
