worker_processes auto;
events { worker_connections 1024; }

http {
  server_tokens off;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

  # Structured logs: easy to ship to Loki/ELK and to query by upstream timing.
  log_format json escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
    '"x_forwarded_for":"$http_x_forwarded_for","request":"$request","status":$status,'
    '"bytes":$body_bytes_sent,"request_time":$request_time,'
    '"upstream":"$upstream_addr","upstream_time":"$upstream_response_time"}';
  access_log /var/log/nginx/access.log json;
  limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;
  limit_req_status 429;

  upstream app {
    zone app 64k;        # shared state: without it each worker balances on its own
    least_conn;
    server app1:80 max_fails=3 fail_timeout=10s;
    server app2:80 max_fails=3 fail_timeout=10s;
    keepalive 16;
  }

  include /etc/nginx/conf.d/*.conf;
}
